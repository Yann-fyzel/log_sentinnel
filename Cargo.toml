[package]
name = "log_sentinnel"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
colored = "3.1.1"
env_logger = "0.11.11"
hostname = "0.4.2"
local-ip-address = "0.6.13"
log = "0.4.34"
notify = "8.2.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] } 
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
